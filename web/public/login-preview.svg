<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img"
     aria-labelledby="lp-title">
  <title id="lp-title">Örnek ortak canvas: bir ürün planının düğüm ve bağlantılarla haritalanmış hâli</title>
  <!--
    Giriş ekranının varsayılan önizleme görseli — admin panelinden bir görsel yüklenmediğinde gösterilir.
    Gerçek kullanıcı verisi değil, uygulamanın akış görünümünü taklit eden örnek bir kurgudur.
    Renkler styles.css'teki aydınlık tema değişkenlerinin hex karşılıklarıdır.
  -->
  <defs>
    <pattern id="lp-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#cdc9bd" />
    </pattern>
    <marker id="lp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c4bfae" />
    </marker>
    <filter id="lp-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#3c321e" flood-opacity="0.10" />
    </filter>
    <clipPath id="lp-clip"><rect width="640" height="400" rx="10" /></clipPath>
  </defs>

  <g clip-path="url(#lp-clip)" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect width="640" height="400" fill="#faf9f5" />
    <rect width="640" height="400" fill="url(#lp-dots)" />

    <!-- bağlantılar (akış: düz mavi, bağımlılık: kesik mor) -->
    <g fill="none" stroke="#c4bfae" stroke-width="2" marker-end="url(#lp-arrow)">
      <path d="M320 88 C320 132 135 126 135 168" />
      <path d="M320 88 L320 168" />
      <path d="M320 88 C320 132 505 126 505 168" />
      <path d="M135 222 C135 266 320 258 320 298" />
      <path d="M320 222 L320 298" />
    </g>
    <path d="M505 222 C505 266 320 258 320 298" fill="none" stroke="#a07ad0" stroke-width="2"
          stroke-dasharray="6 5" marker-end="url(#lp-arrow)" />

    <!-- kök: kilometre taşı -->
    <g filter="url(#lp-shadow)">
      <rect x="245" y="36" width="150" height="52" rx="8" fill="#f7f2fc" stroke="#a07ad0" stroke-width="1.5" />
    </g>
    <text x="262" y="58" font-size="13.5" font-weight="600" fill="#1f1e1d">Ürün Planı</text>
    <text x="262" y="76" font-size="10.5" fill="#78766e">kilometre taşı · #1</text>
    <circle cx="381" cy="52" r="3.5" fill="#a07ad0" />

    <!-- orta sıra -->
    <g filter="url(#lp-shadow)">
      <rect x="60" y="170" width="150" height="52" rx="8" fill="#faf5e4" stroke="#d8d4c8" stroke-width="1.5" />
    </g>
    <text x="77" y="192" font-size="13.5" font-weight="600" fill="#1f1e1d">Fikir toplama</text>
    <text x="77" y="210" font-size="10.5" fill="#78766e">fikir · ayşe</text>

    <g filter="url(#lp-shadow)">
      <rect x="245" y="170" width="150" height="52" rx="8" fill="#eef4ea" stroke="#d8d4c8" stroke-width="1.5" />
    </g>
    <text x="262" y="192" font-size="13.5" font-weight="600" fill="#1f1e1d">Tasarım</text>
    <text x="262" y="210" font-size="10.5" fill="#78766e">özellik · bora</text>

    <g filter="url(#lp-shadow)">
      <rect x="430" y="170" width="150" height="52" rx="8" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.5" />
    </g>
    <text x="447" y="192" font-size="13.5" font-weight="600" fill="#1f1e1d">Araştırma</text>
    <text x="447" y="210" font-size="10.5" fill="#78766e">görev · ayşe</text>

    <!-- alt: yayın -->
    <g filter="url(#lp-shadow)">
      <rect x="245" y="300" width="150" height="52" rx="8" fill="#f7f2fc" stroke="#a07ad0" stroke-width="1.5" />
    </g>
    <text x="262" y="322" font-size="13.5" font-weight="600" fill="#1f1e1d">Yayın</text>
    <text x="262" y="340" font-size="10.5" fill="#78766e">kilometre taşı · #7</text>

    <!-- commit rozeti -->
    <g>
      <rect x="18" y="18" width="104" height="24" rx="12" fill="#faeee8" stroke="#e6bba7" />
      <circle cx="34" cy="30" r="3.5" fill="#d97757" />
      <text x="44" y="34" font-size="11" font-weight="600" fill="#a54a2b">commit #7</text>
    </g>

    <!-- eşzamanlı kullanıcı rozetleri -->
    <g>
      <circle cx="586" cy="30" r="11" fill="#d97757" />
      <text x="586" y="34" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
      <circle cx="610" cy="30" r="11" fill="#4a7c43" />
      <text x="610" y="34" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
    </g>
  </g>
</svg>
