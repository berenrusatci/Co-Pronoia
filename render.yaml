services:
  - type: web
    name: treemapper
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # İmajın öntanımlısı yerel dağıtım (APP_MODE=local); barındırılan kurulum bulut modudur.
      - key: APP_MODE
        value: cloud
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
